name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate the release tag
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-list -n 1 "refs/tags/${GITHUB_REF_NAME}")" = "$(git rev-parse HEAD)"
          test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < VERSION)"
      - name: Build release assets
        run: python tools/build_release.py --output "${{ runner.temp }}/release"
      - name: Transfer release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Receive release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: ${{ runner.temp }}/release
      - name: Publish and read back the release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_DIR/coordinator-$version.zip" \
            "$RELEASE_DIR/coordinator-latest.zip" \
            "$RELEASE_DIR/install.py" \
            --verify-tag --latest --title "Agent Coordinator $GITHUB_REF_NAME" --generate-notes
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json
          import os
          import pathlib

          release = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "release.json").read_text())
          tag = os.environ["GITHUB_REF_NAME"]
          expected = {f"coordinator-{tag.removeprefix('v')}.zip", "coordinator-latest.zip", "install.py"}
          assert release["tagName"] == tag
          assert not release["isDraft"] and not release["isPrerelease"]
          assert {asset["name"] for asset in release["assets"]} == expected
          PY
