name: Trusted agentic E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-agentic-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: trusted-agentic-e2e
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install the trusted checkout
        run: |
          python tools/build_release.py --output "${{ runner.temp }}/release" --source-commit "${{ github.sha }}"
          python tools/verify_release.py --release-dir "${{ runner.temp }}/release" --source-commit "${{ github.sha }}"
          python "${{ runner.temp }}/release/install.py" ensure-global --source "${{ runner.temp }}/release/coordinator-3.0.0.zip" --between-sessions --json
      - name: Record the clean repository boundary
        env:
          BASELINE_DIR: ${{ runner.temp }}/repository-baseline
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
          for path in .agent-coordinator .agents/skills/coordinator .codex/config.toml .codex/agents/coordinator; do
            if [ -e "$path" ] || [ -L "$path" ]; then
              exit 1
            fi
          done
          mkdir "$BASELINE_DIR"
          cp "$(git rev-parse --git-path config)" "$BASELINE_DIR/config"
          cp -a "$(git rev-parse --git-path hooks)" "$BASELINE_DIR/hooks"
      - name: Exercise Coordinator through Codex
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Use the installed $coordinator skill for a bounded behavioral E2E against this trusted checkout.
            Do not access environment variables, credentials, GitHub APIs, or the network, and do not modify repository files.
            Coordinate two independent read-only checks: confirm the public v3 package and eight-role contract from tracked files, and execute the documented unit-test command.
            Exercise the installed dashboard with `watch --once --json`, reconcile the evidence, and finish with a clear pass or fail summary.
            Treat any failed command, repository modification, or Coordinator-owned project-local file as failure.
          working-directory: ${{ github.workspace }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          codex-version: '0.147.0'
          model: gpt-5.6-sol
          effort: max
      - name: Verify the repository boundary
        if: always()
        env:
          BASELINE_DIR: ${{ runner.temp }}/repository-baseline
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
          cmp "$BASELINE_DIR/config" "$(git rev-parse --git-path config)"
          diff -r "$BASELINE_DIR/hooks" "$(git rev-parse --git-path hooks)"
          for path in .agent-coordinator .agents/skills/coordinator .codex/config.toml .codex/agents/coordinator; do
            if [ -e "$path" ] || [ -L "$path" ]; then
              exit 1
            fi
          done
