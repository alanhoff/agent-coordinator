[project]
name = "agent-coordinator"
version = "3.0.0"
description = "Durable, globally installed multi-agent workflow coordination for Codex"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Agent Coordinator maintainers" }]
keywords = ["codex", "agents", "orchestration"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/alanhoff/agent-coordinator"
Issues = "https://github.com/alanhoff/agent-coordinator/issues"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
